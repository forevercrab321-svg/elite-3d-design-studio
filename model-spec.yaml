# Shared numeric source of truth for the modeling team (CLAUDE.md §21).
# Generators read values from here; do not hard-code them in scripts.
# Populate per project. Keep units explicit.

project:
  name: null          # set when the first brief arrives
  type: null          # architecture | product | site | vehicle | environment | ...
  units: meters       # meters for architecture / sites; millimeters for products
  up_axis: Y          # Three.js / glTF convention
  handedness: right

delivery:
  targets: []         # e.g. [glb-web, render-stills, fbx]
  performance:
    max_triangles: null
    max_draw_calls: null
    max_texture_size: 2048
    compression: [draco, ktx2]

site:
  ground_size: 60     # metres; neutral datum plane at y = 0

references:           # review aids — rendered, never exported
  scale_figure: true      # 1750 mm human proxy
  calibration_cube: true  # 1 m cube

render:
  resolution: [1600, 900]
  exposure: 1.0

camera:
  # Named physical cameras. lens/sensor in mm (sensor = horizontal film width).
  # Set locked: true once the Creative Director approves a view (§14, §19).
  # Orthographic QA views top / front / right are generated automatically.
  views:
    review_persp:
      position: [7.5, 3.2, 9.0]
      target: [0.6, 0.9, 0.0]
      lens: 35
      sensor: 36
      locked: false

lighting:
  sun_azimuth_deg: 225    # clockwise from north (-Z)
  sun_elevation_deg: 38
  sun_intensity: 2.6
  sky_intensity: 0.9

systems: {}           # parameter blocks per procedural system, e.g.
                      # solar: { tilt: 30, orientation: north, row_spacing: 6.0 }
                      # road:  { width: 6.5 }
                      # landscape: { tree_spacing: 8 }
